<title>Z-2099 Prototipo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#141614;--surface:#1d201c;--surface2:#262a25;--ink:#e6e3da;--muted:#9aa096;--line:#353a34;--accent:#c9553d;--olive:#9db060;--hazard:#e0b43a;--focus:#8fb3ec;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior:none;}
button{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);padding:9px 12px;cursor:pointer;border-radius:3px;}
button:disabled{opacity:.4;cursor:default}
button.primario{background:var(--accent);border-color:var(--accent);color:#1a0c09;font-weight:600}
button.ancho{width:100%;margin-top:10px;padding:14px}
button.mini{font-size:13px;padding:5px 9px}
button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);padding:9px 10px;width:100%;border-radius:3px}
label{display:block;margin:12px 0 6px;font-size:14px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .peligro{color:var(--accent)} .bien{color:var(--olive)}
.pantalla{min-height:100%;display:flex;flex-direction:column}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 16px,#111 16px 32px);flex:none}
.cont{padding:20px;max-width:560px;margin:0 auto;width:100%}
h1{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase;margin:0 0 6px}
h1 span{color:var(--accent)} h1.victoria{color:var(--olive)} h1.derrota{color:var(--accent)}
h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;font-size:32px;line-height:1;text-transform:uppercase;margin:0 0 6px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nombres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
/* pasar */
#p-pasar .cont{text-align:center;padding-top:14vh}
#pasar-nombre{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:64px;line-height:1;text-transform:uppercase;margin:10px 0 24px}
/* reparto */
.carta-personaje{display:block;width:100%;text-align:left;background:var(--surface);border-left:5px solid var(--c);margin-top:12px;padding:14px}
.cp-nombre{font-weight:600;font-size:19px}.cp-nombre span{color:var(--muted);font-weight:400;margin-left:8px}
.cp-stats{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin:4px 0 8px}
.cp-h{font-size:14px;margin-top:4px}.cp-h.contra b{color:var(--accent)}
/* juego */
#p-juego,#p-zombi{height:100%;height:100dvh;overflow:hidden}
.cabecera{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.cabecera .mision{flex:1;min-width:160px}.cabecera .mision span{color:var(--muted)}
.ruido{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.ruido .lab{color:var(--muted)} .ruido-bar{display:flex;gap:2px}.ruido-bar i{width:9px;height:12px;background:var(--surface2);border:1px solid var(--line)}.ruido-bar i.on{background:var(--hazard)}.ruido.alto .ruido-bar i.on{background:var(--accent)}
.tablero{flex:1;position:relative;min-height:200px;background:#101210}
.tablero canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tablero .encuadrar{position:absolute;right:8px;top:8px;font-size:12px;padding:5px 8px;background:rgba(20,22,20,.8)}
.panel{flex:none;max-height:46vh;overflow:auto;padding:10px 12px 6px;background:var(--surface);border-top:3px solid var(--c,var(--line))}
#p-zombi .panel{border-top-color:#8fa86a}
.quien{font-size:15px}.quien b{font-size:17px}.quien .vida{margin-left:8px;color:var(--accent);letter-spacing:1px}
.estado{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 6px;border:1px solid var(--line);color:var(--muted)}.tag.peligro{border-color:var(--accent);color:var(--accent)}.tag.bien{border-color:var(--olive);color:var(--olive)}
.fila{display:flex;align-items:center;gap:12px;margin:6px 0}
.dados{display:flex;gap:6px}.dado{width:40px;height:40px;font-size:20px;padding:0;background:#e6e3da;color:#151714;border:2px solid #b9b6ab;border-radius:6px;font-weight:700}
.dado.ruido{background:var(--hazard)}.dado.mordisco{background:var(--accent);color:#fff}.dado.doble{background:var(--olive)}
.contadores{display:flex;gap:14px;font-size:14px;color:var(--muted)}.contadores b{color:var(--ink);font-size:18px}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.acciones button{font-size:14px;padding:8px 10px}
.ayuda{margin:4px 0 0}
.mano{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 12px 10px;background:var(--bg);border-top:1px solid var(--line);align-items:stretch}
.mano .peso{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:center}
.carta{flex:none;width:118px;text-align:left;padding:8px;background:#e9e4d6;color:#1a1a18;border:1px solid #b9b6ab;border-radius:4px;display:flex;flex-direction:column;gap:2px;min-height:64px}
.carta b{font-size:13px;line-height:1.2}.carta span{font-size:11px;color:#5a5a55}
.carta.arma{background:#e6d3c3}.carta.consumible{background:#d8e2cc}.carta.vehiculo,.carta.combustible{background:#d9d9e6}.carta.material{background:#e9e4d6}.carta.otro{background:#e6dcc0}
/* modal */
#modal-fondo:has(> #modal[hidden]){display:none}
#modal-fondo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--surface);border-top:3px solid var(--line);width:100%;max-width:560px;max-height:85vh;overflow:auto;padding:16px 16px 18px}
.modal.peligro{border-top-color:var(--accent)}.modal.bien{border-top-color:var(--olive)}.modal.evento{border-top-color:var(--hazard)}
#modal-titulo{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:28px;text-transform:uppercase;margin:0 0 8px;line-height:1}
#modal-cuerpo h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hazard);margin:14px 0 4px}#modal-cuerpo h4:first-child{margin-top:0}#modal-cuerpo p{margin:0 0 6px;font-size:15px}
.red{border:1px solid var(--line);padding:14px 16px;margin:0 0 18px;background:var(--surface)}.red h2{font-size:26px;margin-bottom:2px}
.codigo{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:72px;line-height:1;letter-spacing:.12em;color:var(--hazard);margin:4px 0 8px}
.lista-sala{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}.lista-sala .jug{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border:1px solid var(--line)}.lista-sala .jug .tag{margin-left:auto}.lista-sala .off{opacity:.55}
.mini-log{margin-top:8px;max-height:120px;overflow:auto}
#modal-botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lista{display:flex;flex-direction:column;gap:6px}.lista button{text-align:left}
.objetivo{padding:8px;background:var(--surface2);border:1px solid var(--line)}.objetivo div{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.receta{display:flex;flex-direction:column;gap:2px}.receta span{font-size:13px;color:var(--olive)}.receta small{color:var(--muted)}.receta.falta span{color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink)}.check input{width:auto}
.log .l{padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}.log .r{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-right:8px}.log .peligro{color:#e08a7a}.log .bien{color:var(--olive)}.log .combate{color:#e0c48a}.log .mision{color:var(--hazard)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#e6e3da;color:#151714;padding:8px 14px;border-radius:3px;font-size:14px;z-index:30;max-width:90vw}
.expediente{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}.expediente th,.expediente td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.expediente th{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.informe{width:100%;min-height:210px;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.5;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px;resize:vertical}
.expediente td.zombi,.expediente td.muerto{color:var(--accent)}.expediente td.vivo{color:var(--olive)}
</style>

<div id="p-inicio" class="pantalla"><div class="hazard"></div><div class="cont">
  <div class="eyebrow">Prototipo M0 · reglas · un móvil que se pasa</div>
  <h1>Z-<span>2099</span></h1>
  <p class="muted">Juego cooperativo de supervivencia. Cada jugador planifica su turno en este móvil y lo pasa al siguiente. De 2 a 10 supervivientes, 12 personajes y 12 misiones.</p>
  <div class="cont"></div>
</div></div>

<div id="p-reparto" class="pantalla" hidden><div class="hazard"></div><div class="cont"></div></div>

<div id="p-juego" class="pantalla" hidden>

  <div class="panel"></div>
  <div class="mano"></div>
</div>

<div id="p-zombi" class="pantalla" hidden>

  <div class="panel"></div>
  <div class="mano"></div>
</div>

<div id="p-espera" class="pantalla" hidden>
  <div class="cabecera"></div>

</div>

<div id="p-sala" class="pantalla" hidden><div class="hazard"></div><div class="cont"></div></div>

<div id="modal-fondo"><div id="modal" class="modal" role="dialog" hidden><h3 id="modal-titulo"></h3><div id="modal-cuerpo"></div><div id="modal-botones"></div></div></div>

      if (ICON[c.tipo]) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = `${s * 0.7}px sans-serif`; ctx.fillText(ICON[c.tipo], x, y - (ocupada ? s * 0.45 : 0)); }
      if (c.saqueos >= PARAMS.saqueosPorCasilla && ['edificio', 'gasolinera', 'farmacia', 'taller'].includes(c.tipo)) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill(); }
      if (c.objetos.length) { ctx.font = `${s * 0.6}px sans-serif`; ctx.fillText(c.objetos.includes('suministro') ? '📦' : '🚗', x, y); }
    } else { ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.font = `${s * 0.7}px sans-serif`; ctx.fillText('?', x, y); }
  }
  ctx.lineWidth = Math.max(1, s * 0.09); ctx.strokeStyle = 'rgba(230,227,218,.18)';
  for (const c of Object.values(G.casillas)) { const [px, py] = pixel(c.k, s); const x = ox + px, y = oy + py; vecinos(c.k).forEach((v, i) => { const n = G.casillas[v]; if (n && n.loseta === c.loseta) return; const a = Math.PI / 6 + (i + 4) * Math.PI / 3, b = a + Math.PI / 3; ctx.beginPath(); ctx.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); ctx.lineTo(x + rr * Math.cos(b), y + rr * Math.sin(b)); ctx.stroke(); }); }
  // barricadas
  ctx.lineWidth = Math.max(3, s * 0.18); ctx.strokeStyle = '#e0b43a';
  for (const ar of G.barricadas) { const [a, b] = ar.split('|'); const i = vecinos(a).indexOf(b); if (i < 0) continue; const [px, py] = pixel(a, s); const x = ox + px, y = oy + py; const a1 = Math.PI / 6 + (i + 4) * Math.PI / 3, a2 = a1 + Math.PI / 3; ctx.beginPath(); ctx.moveTo(x + rr * Math.cos(a1), y + rr * Math.sin(a1)); ctx.lineTo(x + rr * Math.cos(a2), y + rr * Math.sin(a2)); ctx.stroke(); }
  for (const k of [...dest, ...zdest]) { const [px, py] = pixel(k, s); hexPath(ctx, ox + px, oy + py, rr - s * 0.08); ctx.lineWidth = Math.max(2, s * 0.12); ctx.strokeStyle = dest.has(k) ? (UI.modo === 'mover' ? '#9db060' : '#e0b43a') : '#c9553d'; ctx.stroke(); }
  if (UI.modo === 'zhorda_dest' && UI.zSel && G.zombis[UI.zSel]) { const [px, py] = pixel(G.zombis[UI.zSel].pos, s); hexPath(ctx, ox + px, oy + py, rr - s * 0.08); ctx.strokeStyle = '#e0b43a'; ctx.stroke(); }
  for (const z of Object.values(G.zombis)) { const c = G.casillas[z.pos]; if (!c.revelada) continue; if (z.tipo === 'jugador' && z.oculto && !(G.fase === 'zombi' && (!RED.activa || RED.asiento === z.jugadorId))) continue; const [px, py] = pixel(z.pos, s); const x = ox + px + s * 0.3, y = oy + py + s * 0.25; const r = s * (esHorda(z) ? 0.42 : 0.32);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = z.tipo === 'jugador' ? '#8fa86a' : z.tipo === 'acorazado' ? '#3a3f4a' : z.tipo === 'corredor' ? '#7a5a3a' : z.tipo === 'nino' ? '#6a5a6a' : '#4f5a3a'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = z.oculto ? '#e0b43a' : '#c9553d'; ctx.stroke();
    ctx.fillStyle = '#e6e3da'; ctx.font = `bold ${r * 1.1}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(z.n > 1 ? ZOMBIS[z.tipo].letra + z.n : ZOMBIS[z.tipo].letra, x, y); }
  for (const j of G.jugadores) { if (!['vivo', 'caido'].includes(j.estado)) continue; if (j.pasajeroDe != null) continue; const [px, py] = pixel(j.pos, s); const compa = jugadoresEn(G, j.pos).filter(x => x.pasajeroDe == null); const i = compa.indexOf(j); const ang = compa.length > 1 ? (i / compa.length) * Math.PI * 2 : 0; const off = compa.length > 1 ? s * 0.32 : 0;
    const x = ox + px - s * 0.15 + Math.cos(ang) * off, y = oy + py - s * 0.15 + Math.sin(ang) * off; const r = s * 0.3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = PERSONAJES[j.personajeId].color; ctx.fill(); ctx.lineWidth = actual && actual.id === j.id ? 4 : 2; ctx.strokeStyle = actual && actual.id === j.id ? '#fff' : j.estado === 'caido' ? '#c9553d' : '#151714'; ctx.stroke();
    ctx.fillStyle = '#151714'; ctx.font = `bold ${r * 1.1}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(j.estado === 'caido' ? '✕' : j.vehiculo ? '🚗' : String(j.id + 1), x, y); if (j.mordido) { ctx.fillStyle = '#c9553d'; ctx.beginPath(); ctx.arc(x + r * 0.8, y - r * 0.8, r * 0.4, 0, Math.PI * 2); ctx.fill(); } }
}
function casillaEn(cx, cy) { const cv = canvas(); const { s, x: ox, y: oy } = UI.cam; const dpr = cv._dpr || 1; const x = (cx * dpr - ox) / s, y = (cy * dpr - oy) / s; const r = y / 1.5, q = x / Math.sqrt(3) - r / 2; let rq = Math.round(q), rr = Math.round(r), rs = Math.round(-q - r); const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - (-q - r)); if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs; const k = rq + ',' + rr; return G.casillas[k] ? k : null; }
function tocar(k) {
  if (!k) return;
  if (G.fase === 'turno') {
    const j = turnoActual(G);
    if (UI.modo === 'molotov') { const m = j.mano.find(cc => cc.id === 'molotov'); UI.modo = 'mover'; tras(m ? M.usar(G, m.uid, k) : { ok: false }); return; }
    if (UI.modo === 'barricada') { const m = j.mano.find(cc => cc.id === 'barricada'); UI.modo = 'mover'; tras(m ? M.usar(G, m.uid, k) : { ok: false }); return; }
    if (UI.modo === 'rastreo') { Promise.resolve(M.rastrear(G, k)).then(r => { if (r.ok) UI.modo = 'mover'; tras(r); }); return; }
    if (destinosPosibles(G).includes(k)) { tras(M.mover(G, k)); return; }
    const objs = objetivosAtaque(G).filter(o => o.z.pos === k); if (objs.length && G.turno.acciones > 0) { elegirAtaque(objs); return; }
    info(k);
  } else if (G.fase === 'zombi') {
    if (UI.modo === 'zmover') { Promise.resolve(M.zMover(G, k)).then(r => { if (!r.ok) info(k); else tras(r); }); return; }
    if (UI.modo === 'zhorda_sel') { const zs = zombisEn(G, k).filter(z => z.tipo !== 'jugador'); if (!zs.length) { info(k); return; } UI.zSel = zs.sort((a, b) => b.n - a.n)[0].id; UI.modo = 'zhorda_dest'; toast('Ahora toca la casilla de destino'); dibujar(); return; }
    if (UI.modo === 'zhorda_dest') { const p = M.zMoverHorda(G, UI.zSel, k); UI.modo = 'zhorda_sel'; UI.zSel = null; tras(p); return; }
  }
}
function info(k) { const c = G.casillas[k]; if (!c.revelada) { modal('Loseta oculta', '<p>Se revela al entrar. Puede haber zombis.</p>'); return; } const zs = zombisEn(G, k).filter(z => !(z.tipo === 'jugador' && z.oculto)).map(z => `${ZOMBIS[z.tipo].nombre}${z.n > 1 ? ' ×' + z.n : ''}${esHorda(z) ? ' (horda)' : ''}`); const js = jugadoresEn(G, k).map(j => `${j.nombre} (${PERSONAJES[j.personajeId].alias})`);
  const tipo = { calle: 'Calle. Los vehículos circulan por aquí.', edificio: 'Edificio. Se puede saquear dos veces. Los zombis tardan en entrar.', bosque: 'Bosque. Cuesta 2 pasos. Bloquea la visión.', gasolinera: 'Gasolinera. Saquear da bidones y hace ruido.', farmacia: 'Farmacia. Botiquín y antibióticos, dos saqueos.', taller: 'Taller. Craftear aquí es gratis. Piezas, tablas, chapa y recetarios.', refugio: 'Refugio. Cura 1 al final de la ronda. Comida, antibióticos y semillas se depositan aquí.', entrada: 'Entrada de horda.', helipuerto: 'Helipuerto. Objetivo de Sin una gota.', torre: 'Torre de radio. Objetivo de La emisora.', laboratorio: 'Laboratorio. Aquí se entregan las muestras.', generador: 'Generador. Aquí se dejan los bidones.' }[c.tipo];
  modal(c.tipo[0].toUpperCase() + c.tipo.slice(1), `<p>${tipo}</p>${c.saqueos ? `<p class="muted">Saqueada ${c.saqueos} vez/veces.</p>` : ''}${c.fuego ? `<p class="peligro">Arde ${c.fuego} rondas.</p>` : ''}${c.senuelo ? `<p>Señuelo activo ${c.senuelo} rondas.</p>` : ''}${c.objetos.length ? `<p>Hay algo: ${c.objetos.map(o => OBJETOS[o].nombre).join(', ')}.</p>` : ''}${zs.length ? `<p><b>Zombis:</b> ${zs.join(', ')}</p>` : ''}${js.length ? `<p><b>Supervivientes:</b> ${js.join(', ')}</p>` : ''}`); }

/* ---------- gestos ---------- */
function gestos(cv) {
  let drag = null, pinch = null, movido = false;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; movido = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id || pinch) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 6) movido = true; if (movido) { UI.cam.x += dx * (cv._dpr || 1); UI.cam.y += dy * (cv._dpr || 1); drag.x = e.clientX; drag.y = e.clientY; dibujar(); } });
  cv.addEventListener('pointerup', e => { if (drag && !movido && !pinch) { const r = cv.getBoundingClientRect(); tocar(casillaEn(e.clientX - r.left, e.clientY - r.top)); } drag = null; });
  cv.addEventListener('pointercancel', () => { drag = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 0.9 : 1.1, e.clientX, e.clientY, cv); }, { passive: false });
  cv.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); drag = null; } }, { passive: true });
  cv.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); zoom(d / pinch, (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2, cv); pinch = d; } }, { passive: true });
  cv.addEventListener('touchend', () => { setTimeout(() => pinch = null, 50); });
}
function zoom(k, cx, cy, cv) { const r = cv.getBoundingClientRect(); const dpr = cv._dpr || 1; const px = (cx - r.left) * dpr, py = (cy - r.top) * dpr; const ns = Math.min(UI.cam.s * k, 120 * dpr); const kk = ns / UI.cam.s; if (ns < 6) return; UI.cam.x = px - (px - UI.cam.x) * kk; UI.cam.y = py - (py - UI.cam.y) * kk; UI.cam.s = ns; dibujar(); }

/* ---------- arranque ---------- */
window.addEventListener('resize', () => { UI.cam.ajustada = false; ajustarCanvas(); dibujar(); });
document.querySelectorAll('canvas').forEach(gestos);
document.querySelectorAll('.encuadrar').forEach(b => b.addEventListener('click', () => { encuadrar(); dibujar(); }));
$('#modal-fondo').addEventListener('click', e => { if (e.target.id === 'modal-fondo') cerrarModal(); });
if (!redReanudar()) { if (cargar()) reanudar(); else inicio(); }

</script>
